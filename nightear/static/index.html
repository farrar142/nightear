<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nightear</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #12151c; color: #e6e9ef; margin: 0; padding: 24px; max-width: 900px; margin-inline: auto; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    select, button { background: #1d2230; color: inherit; border: 1px solid #343b50; border-radius: 6px; padding: 8px 12px; font-size: 14px; }
    button { cursor: pointer; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; background: #343b50; }
    .badge.ok { background: #1f6f43; }
    .badge.bad { background: #8a2c2c; }
    .meter { position: relative; height: 28px; background: #1d2230; border-radius: 6px; overflow: hidden; border: 1px solid #343b50; }
    .meter-bar { height: 100%; width: 0; background: linear-gradient(90deg, #2e9e63, #d6b83a 70%, #d24a4a); transition: width 80ms linear; }
    .meter-text { margin-top: 8px; font-variant-numeric: tabular-nums; color: #aab2c5; }
    small { color: #7f8aa3; }
    .graph { display: block; width: 100%; height: 220px; margin-top: 16px; background: #1d2230; border: 1px solid #343b50; border-radius: 6px; }
    .events { list-style: none; padding: 0; margin: 0; font-variant-numeric: tabular-nums; font-size: 14px; }
    .events li { padding: 6px 0; border-bottom: 1px solid #262c3d; white-space: pre-wrap; }
    .events li.empty { color: #7f8aa3; }
    .events li.clickable { cursor: pointer; }
    .events li.clickable:hover, .events li.selected { background: #1d2230; }
    .event-scroll { position: relative; max-height: 55vh; overflow-y: auto; border: 1px solid #262c3d; border-radius: 6px; padding: 0 8px; }
    .events li.event-group { padding: 0; white-space: normal; }
    .event-group > details > summary { cursor: pointer; padding: 8px 0; position: sticky; top: 0; background: #12151c; z-index: 1; }
    .event-group > details > summary small { margin-left: 8px; }
    .event-group > details > ul { padding-left: 14px; }
    .clip-panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px max(16px, calc((100vw - 900px) / 2)); background: #1d2230; border-top: 1px solid #343b50; box-shadow: 0 -6px 18px rgba(0,0,0,0.45); }
    .clip-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    .clip-head button { padding: 4px 10px; }
    body.dock-open { padding-bottom: 240px; }
    input[type=date] { background: #1d2230; color: inherit; border: 1px solid #343b50; border-radius: 6px; padding: 7px 10px; font-size: 14px; }
    .clip-wave { display: block; width: 100%; height: 70px; cursor: pointer; margin-bottom: 8px; }
    .clip-panel audio { width: 100%; margin-bottom: 8px; }
    .stats-heat { display: block; width: 100%; height: 190px; background: #1d2230; border: 1px solid #343b50; border-radius: 6px; margin-bottom: 6px; }
    .stats-labels li { display: flex; gap: 10px; align-items: center; }
    .stat-name { width: 160px; flex: none; overflow: hidden; text-overflow: ellipsis; }
    .stat-bar { flex: 1; background: #262c3d; border-radius: 4px; height: 10px; }
    .stat-bar i { display: block; height: 100%; background: #6aa5ff; border-radius: 4px; }
    .stat-n { width: 36px; text-align: right; }
    .clip-panel a { color: #6aa5ff; }
    .star-btn { background: none; border: 0; color: #f2c14e; cursor: pointer; font-size: 16px; padding: 0 6px 0 0; }
  </style>
</head>
<body>
  <h1>nightear</h1>

  <div class="row">
    <label for="device">입력 장치</label>
    <select id="device"></select>
    <button id="start" type="button">수집 시작</button>
    <button id="pause" type="button" disabled>일시정지</button>
  </div>

  <div class="row">
    <span>수집 연결</span><span id="ingest-status" class="badge">대기</span>
    <span>역할</span><span id="role-status" class="badge">-</span>
    <span>활성 소스</span><span id="active-source">없음</span>
    <span>실시간 채널</span><span id="realtime-status" class="badge">대기</span>
  </div>

  <div class="row">
    <span>수면 모드</span><span id="sleep-status" class="badge">대기</span>
    <small id="sleep-reasons"></small>
  </div>

  <div class="meter"><div id="meter-bar" class="meter-bar"></div></div>
  <div class="meter-text"><span id="meter-db">-- dBFS</span> <small>(-60 ~ 0 dBFS)</small></div>

  <canvas id="graph" class="graph"></canvas>
  <div class="meter-text"><small id="baseline-text">기준선 계산 중...</small>
    <small>녹색 레벨 / 파랑 기준선 / 노랑 점선 트리거 / 빨강 이벤트</small></div>

  <div class="row" style="margin-top:20px">
    <h2 style="font-size:16px;margin:0">이벤트</h2>
    <select id="label-filter"><option value="">전체 라벨</option></select>
    <select id="event-sort"><option value="time">시간순</option><option value="size">크기순</option></select>
    <input id="event-day" type="date" title="날짜를 고르면 그날 이벤트만 봅니다">
    <button id="event-recent" type="button">최근</button>
  </div>
  <div class="event-scroll"><ul id="event-list" class="events"></ul></div>

  <div id="clip-panel" class="clip-panel" hidden>
    <div class="clip-head"><span id="clip-title"></span><button id="clip-close" type="button" title="닫기">✕</button></div>
    <div id="clip-info" class="meter-text"></div>
    <div id="clip-body">
      <canvas id="clip-wave" class="clip-wave"></canvas>
      <audio id="clip-audio" controls preload="none"></audio>
      <a id="clip-download" href="#" download>내려받기</a>
    </div>
  </div>

  <div class="row" style="margin-top:28px">
    <h2 style="font-size:16px;margin:0">패턴 통계</h2>
    <select id="stats-period">
      <option value="7">최근 7일</option><option value="30" selected>최근 30일</option><option value="0">전체</option>
    </select>
    <button id="stats-refresh" type="button">새로고침</button>
    <small id="stats-total"></small>
  </div>
  <canvas id="stats-heat" class="stats-heat"></canvas>
  <small>요일(행) × 시간대(열)별 이벤트 수</small>
  <ul id="stats-labels" class="events stats-labels"></ul>

  <script src="stats.js" type="module"></script>
  <section id="timeline">
    <div class="row" style="margin-top:28px">
      <h2 style="font-size:16px;margin:0">밤 타임라인</h2>
      <button id="tl-refresh" type="button">새로고침</button>
    </div>
    <ul id="tl-night-list" class="events"></ul>
    <div id="tl-detail" hidden>
      <div class="meter-text" id="tl-title"></div>
      <canvas id="tl-canvas" class="graph"></canvas>
      <div class="meter-text"><small>연한 녹색 초당 최대 / 진한 녹색 초당 평균 / 파란 띠 수면 모드 / 회색 띠 수집 공백 / 빨강 점 이벤트(클릭)</small></div>
      <div class="event-scroll"><ul id="tl-events" class="events"></ul></div>
    </div>
  </section>
  <style>
    #tl-night-list li.clickable, #tl-events li.clickable { cursor: pointer; }
    #tl-events li.selected { background: #2b2f1d; }
  </style>

  <script src="app.js" type="module"></script>
</body>
</html>
