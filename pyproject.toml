[project]
name = "nightear"
version = "0.1.0"
description = "수면 중 소음 기록기 (sleep-noise recorder)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "tzdata",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.17",
    "numpy",
]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nightear*"]

[tool.setuptools.package-data]
nightear = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W ignore::DeprecationWarning"
markers = ["ml: 실제 ML 모델(YAMNet)이 필요한 테스트. 모델이 없으면 건너뛴다"]
